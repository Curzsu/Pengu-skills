name: Generate OpenAPI Skill CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-openapi-from-prd-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: generate-openapi-from-prd-tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS are where the loader-encoding and runtime-version
        # incidents actually happened; 3.9 is the oldest Python the skill
        # scripts must still run on, 3.10 keeps the previously verified
        # baseline, and 3.14 guards forward compatibility.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7"

      - name: Run generate-openapi-from-prd tests
        run: python -m unittest discover -s generate-openapi-from-prd/scripts -p "test_*.py"

  # Branch protection on master requires a check named exactly
  # "generate-openapi-from-prd-tests". The matrix above reports one check per
  # combination, so report that stable name from a summary gate; renaming or
  # expanding the matrix then never leaves a PR stuck waiting for a check that
  # no longer exists.
  tests-pass:
    name: generate-openapi-from-prd-tests
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Matrix result
        run: echo "matrix result - ${{ needs.test.result }}"

      - name: Fail when any matrix job failed
        if: ${{ needs.test.result != 'success' }}
        run: exit 1
