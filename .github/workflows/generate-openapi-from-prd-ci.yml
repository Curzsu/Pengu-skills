name: Generate OpenAPI Skill CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-openapi-from-prd-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: generate-openapi-from-prd-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7"

      - name: Run generate-openapi-from-prd tests
        run: python -m unittest discover -s generate-openapi-from-prd/scripts -p "test_*.py"
